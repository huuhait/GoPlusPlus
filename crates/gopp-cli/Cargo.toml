[package]
name = "gopp-cli"
description = "The gopp command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "gopp"
path = "src/main.rs"

[dependencies]
clap.workspace = true
gopp-codegen-c = { path = "../gopp-codegen-c" }
gopp-diag = { path = "../gopp-diag" }
gopp-span = { path = "../gopp-span" }
gopp-syntax = { path = "../gopp-syntax" }
lasso.workspace = true
rayon.workspace = true

[dev-dependencies]
gopp-testutil = { path = "../gopp-testutil" }
tempfile.workspace = true

# `unsafe` is allowed module by module, so the workspace `forbid` cannot apply.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
