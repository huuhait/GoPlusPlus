[package]
name = "gopp-cli"
description = "The gopp command"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "gopp"
path = "src/main.rs"

[dependencies]
clap.workspace = true
gopp-build = { path = "../gopp-build" }
gopp-codegen-c = { path = "../gopp-codegen-c" }
gopp-diag = { path = "../gopp-diag" }
gopp-gir = { path = "../gopp-gir" }
gopp-mangle = { path = "../gopp-mangle" }
gopp-sema = { path = "../gopp-sema" }
gopp-span = { path = "../gopp-span" }
gopp-syntax = { path = "../gopp-syntax" }
gopp-target = { path = "../gopp-target" }
lasso.workspace = true
rayon.workspace = true
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
object.workspace = true
tempfile.workspace = true

# The fast test runner is written for Linux.
[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
libloading.workspace = true

[dev-dependencies]
gopp-testutil = { path = "../gopp-testutil" }

# `unsafe` is allowed module by module, so the workspace `forbid` cannot apply.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
