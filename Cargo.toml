[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.93"

# Versions follow the crate table in docs/adr/0001-implementation-language.md.
[workspace.dependencies]
abi_stable = "0.11.3"
ariadne = "0.6.0"
bitflags = "2.13.2"
blake3 = "1.8.7"
clang-sys = { version = "1.9.1", features = ["runtime"] }
clap = { version = "4.6.7", features = ["derive"] }
divan = "0.1.21"
ena = "0.14.4"
fixedbitset = "0.5.9"
indexmap = "2.14.2"
insta = "1.49.0"
itoa = "1.0.19"
la-arena = "0.3.1"
lasso = { version = "0.7.3", features = ["multi-threaded"] }
libc = "0.2.191"
libloading = "0.9.0"
logos = "0.16.1"
num-bigint = "0.5.1"
object = { version = "0.41.0", default-features = false, features = ["read_core", "elf", "std"] }
petgraph = "0.8.3"
postcard = "1.1.3"
proptest = "1.12.0"
rand = { version = "0.10.3", default-features = false, features = ["chacha"] }
rayon = "1.12.0"
rmp-serde = "1.3.1"
rustc-hash = "2.1.3"
ryu = "1.0.23"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smallvec = "1.16.5"
stacker = "0.1.25"
target-lexicon = "0.13.5"
tempfile = "3.27.0"
thiserror = "2.0.21"
unicode-ident = "1.0.27"
which = "8.0.6"
xxhash-rust = { version = "0.8.19", features = ["xxh3"] }
zstd = "0.14.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
expect_used = "warn"

[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

[profile.dev.package."*"]
opt-level = 1
